name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-install:
    name: Install & import (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Import engine modules
        run: python -c "import excel_reader, compare_engine, report_writer; print('engine modules import OK')"

      - name: Syntax-check the Streamlit app
        run: python -m py_compile app.py

      - name: Smoke test the engine end-to-end
        run: |
          python -c "import pandas as pd; from compare_engine import add_calculated_fields, compare_renewals; d=pd.DataFrame([{'serial_number':'S','instance_number':'I','service_sku':'SKU','product_number':'P','service_type':'TS','quantity':1,'unit_list_price':1000.0,'prorated_list_price':500.0,'start_date':pd.Timestamp('2025-01-01'),'end_date':pd.Timestamp('2025-06-30'),'ldos_date':pd.NaT,'source':'t','source_sheet':'t','source_excel_row':1}]); print('calc OK:', round(float(add_calculated_fields(d)['calculated_extended_list_price'].iloc[0]),2))"
